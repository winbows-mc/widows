<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>离线页面</title>
<style>
body{background:#000;color:#fff;text-align:center;padding-top:120px;font-size:22px;}
#reloadBtn{margin-top:30px;padding:12px 24px;font-size:18px;cursor:pointer;}
</style>
</head>
<body>
<div id="tip">连接失败</div>
<br>
<button id="reloadBtn">点击即可重新加载</button>
<audio id="audio" style="display:none;">
    <source src="audio.mp3" type="audio/mpeg">

<script>
const tipDom = document.getElementById("tip");
const btn = document.getElementById("reloadBtn");
const audio = document.getElementById("audio");
tipDom.innerText = "连接失败";
btn.onclick = function(){
    audio.load();
    audio.play().then(()=>{
        tipDom.innerText = "加载成功，正在播放";
    }).catch(()=>{
        tipDom.innerText = "连接失败";
    })
}
</script>
</body>
</html>
